name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - .devcontainer/**
      - .vscode/**
      - docs/**
      - README.md
      - LICENSE
      - .gitignore

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@7e7e21ddc30bd66316c7b9889405f485b5022c96 # v8.2.0

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest

  container-tests:
    name: Container ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: build
          tags: vcf-annotator:pr

      - name: Test release image
        run: |
          docker run --rm --platform "${{ matrix.platform }}" vcf-annotator:pr --help
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "${PWD}:/work" \
            vcf-annotator:pr \
            --input /work/tests/data/input.vcf \
            --output /tmp/annotated.vcf
